name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Latest stable Elixir / OTP
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up latest stable BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          # `> 0` selects the latest stable release and excludes pre-releases.
          otp-version: "> 0"
          elixir-version: "> 0"

      - name: Restore Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix hex.build --output /tmp/quant.tar
